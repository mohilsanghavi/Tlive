name: Chartink groups to Excel
on:
  schedule:
    - cron: "30 5 * * 1-5"    # 11:00 am IST, Mon-Fri
    - cron: "30 9 * * 1-5"    # 3:00 pm IST, Mon-Fri
    - cron: "0 11 * * 1-5"    # 4:30 pm IST, Mon-Fri
  workflow_dispatch: {}        # lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright openpyxl && playwright install --with-deps chromium
      - run: python chartink_to_excel.py
      - name: Save to repo
        run: |
          git config user.name "chartink-bot"
          git config user.email "chartink-bot@users.noreply.github.com"
          git add data
          git commit -m "Chartink groups $(TZ=Asia/Kolkata date +%F_%H%M)" || echo "nothing to commit"
          git push
